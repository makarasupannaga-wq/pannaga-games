<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>KABADDI</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body { background: #090d16; color: white; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; width: 100vw; height: 100vh; display: flex; flex-direction: column; }
        
        #hud {
            height: 60px; background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            display: flex; justify-content: space-between; align-items: center; padding: 0 15px;
            border-bottom: 3px solid #f59e0b; z-index: 10; flex-shrink: 0; display: none;
        }
        .team-box { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 0.95rem; }
        .score-pill { padding: 4px 14px; border-radius: 8px; font-size: 1.2rem; font-weight: 900; }
        .malnad-pill { background: #0284c7; color: #fff; }
        .karavali-pill { background: #dc2626; color: #fff; }
        
        #timer-box {
            background: #f59e0b; color: #0f172a; padding: 4px 16px; border-radius: 20px;
            font-weight: 900; font-size: 1.1rem; text-align: center;
        }
        #turn-indicator { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 1px; color: #fbbf24; text-align: center; }

        #game-container { position: relative; flex: 1; width: 100%; overflow: hidden; background: #0f172a; }

        /* Banner Overlay */
        #banner {
            position: absolute; top: 20%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(15, 23, 42, 0.95); border: 2px solid #f59e0b; color: #fbbf24;
            padding: 12px 28px; border-radius: 12px; font-size: 1.2rem; font-weight: 900;
            text-transform: uppercase; letter-spacing: 1px; pointer-events: none; display: none; text-align: center; z-index: 25;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
        }

        /* FightKaro Style Start / Character Select Screen */
        #start-screen {
            position: absolute; inset: 0; background: radial-gradient(circle at center, #1e293b 0%, #090d16 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 30; text-align: center; padding: 20px;
        }
        #start-screen h1 { font-size: 2.8rem; color: #f59e0b; text-transform: uppercase; margin-bottom: 5px; text-shadow: 0 0 20px rgba(245,158,11,0.5); letter-spacing: 2px; }
        #start-screen p { color: #94a3b8; margin-bottom: 25px; max-width: 450px; font-size: 0.95rem; line-height: 1.5; }
        
        .start-btn {
            background: linear-gradient(135deg, #f59e0b, #d97706); color: #fff; border: none;
            padding: 16px 45px; font-size: 1.2rem; font-weight: 900; border-radius: 30px;
            cursor: pointer; text-transform: uppercase; box-shadow: 0 6px 20px rgba(245, 158, 11, 0.5);
            letter-spacing: 1px; transition: transform 0.1s;
        }
        .start-btn:active { transform: scale(0.95); }

        /* Mobile Controls */
        #controls {
            position: absolute; bottom: 20px; left: 20px; right: 20px;
            display: none; justify-content: space-between; align-items: flex-end; pointer-events: none; z-index: 20;
        }
        .dpad { display: flex; gap: 12px; pointer-events: auto; }
        .ctrl-btn {
            width: 65px; height: 65px; border-radius: 50%; background: rgba(30, 41, 59, 0.85);
            border: 2px solid rgba(255,255,255,0.4); color: white; font-size: 1.4rem; font-weight: bold;
            display: flex; align-items: center; justify-content: center; touch-action: manipulation;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        .ctrl-btn:active { background: #38bdf8; color: #0f172a; }
        
        .actions { display: flex; gap: 12px; pointer-events: auto; }
        .act-btn {
            width: 75px; height: 75px; border-radius: 50%; border: 3px solid #fff; color: #fff;
            font-weight: 900; font-size: 0.85rem; text-transform: uppercase; touch-action: manipulation;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        #btn-jump { background: #10b981; }
        #btn-action { background: #ef4444; }
        .act-btn:active { transform: scale(0.9); }
    </style>
    <!-- Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

<div id="hud">
  <div class="team-box">
    <span style="color:#38bdf8;">MALNAD</span>
    <span class="score-pill malnad-pill" id="score-you">0</span>
  </div>
  <div>
    <div id="turn-indicator">YOUR RAID</div>
    <div id="timer-box">30s</div>
  </div>
  <div class="team-box">
    <span class="score-pill karavali-pill" id="score-ai">0</span>
    <span style="color:#f87171;">KARAVALI</span>
  </div>
</div>

<div id="game-container">
    <div id="banner">SUPER RAID!</div>

    <div id="start-screen">
        <h1>KABADDI</h1>
        <p><b>FightKaro 3D Style Arena</b><br>
        Cross midline, touch defenders with your photo avatar, and return safely! Defend when AI raids.</p>
        <button class="start-btn" onclick="startMatch()">START MATCH</button>
    </div>

    <div id="controls">
        <div class="dpad">
            <button class="ctrl-btn" id="btn-left">◀</button>
            <button class="ctrl-btn" id="btn-right">▶</button>
        </div>
        <div class="actions">
            <button class="act-btn" id="btn-jump">JUMP</button>
            <button class="act-btn" id="btn-action">TOUCH</button>
        </div>
    </div>
</div>

<script>
let scene, camera, renderer;
let yourTeam = [], aiTeam = [];
let scoreYou = 0, scoreAI = 0;
let mode = 'IDLE', raidTimer = 30, timerInterval = null;
let raiderIndex = 0, aiRaiderIndex = 0;
let baulkCrossed = false, touchedPlayers = [], tackleProgress = 0;
let keys = {};

const textureLoader = new THREE.TextureLoader();

// Player Data with Uploaded Photos
const malnadData = [
    { name: "Pannaga", img: "pannaga.jpg", color: 0x0284c7 },
    { name: "Pramoda", img: "pramoda.jpg", color: 0x0369a1 },
    { name: "Rakshith", img: "rakshith.jpg", color: 0x0284c7 },
    { name: "Rajath", img: "rajath.jpg", color: 0x0369a1 }
];

const karavaliData = [
    { name: "Gowtham", img: "gowtham.jpg", color: 0xdc2626 },
    { name: "Kowshik", img: "kowshik.jpg", color: 0xb91c1c },
    { name: "Prajwal", img: "prajwal.jpg", color: 0xdc2626 },
    { name: "Prajwal KR", img: "prajwal kr.jpg", color: 0xb91c1c },
    { name: "Shreeraga", img: "shreeraga.jpg", color: 0xdc2626 }
];

function init3D() {
    const container = document.getElementById('game-container');

    scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0f172a);

    camera = new THREE.PerspectiveCamera(50, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 5, 18);
    camera.lookAt(0, 1.5, 0);

    renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);

    // Lighting
    scene.add(new THREE.AmbientLight(0xffffff, 0.8));
    const dirLight = new THREE.DirectionalLight(0xffffff, 0.9);
    dirLight.position.set(10, 20, 15);
    scene.add(dirLight);

    // Kabaddi Court Mat
    const matGeo = new THREE.PlaneGeometry(30, 14);
    const matMat = new THREE.MeshStandardMaterial({ color: 0x1e3a8a, roughness: 0.6 });
    const mat = new THREE.Mesh(matGeo, matMat);
    mat.rotation.x = -Math.PI / 2;
    scene.add(mat);

    // Center Line
    const lineGeo = new THREE.PlaneGeometry(0.3, 14);
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const midLine = new THREE.Mesh(lineGeo, lineMat);
    midLine.rotation.x = -Math.PI / 2;
    midLine.position.y = 0.01;
    scene.add(midLine);

    // Baulk Lines
    const baulkMat = new THREE.MeshBasicMaterial({ color: 0xfacc15 });
    const baulkLeft = new THREE.Mesh(lineGeo, baulkMat);
    baulkLeft.rotation.x = -Math.PI / 2;
    baulkLeft.position.set(-6, 0.01, 0);
    scene.add(baulkLeft);

    const baulkRight = new THREE.Mesh(lineGeo, baulkMat);
    baulkRight.rotation.x = -Math.PI / 2;
    baulkRight.position.set(6, 0.01, 0);
    scene.add(baulkRight);

    window.addEventListener('resize', () => {
        camera.aspect = container.clientWidth / container.clientHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(container.clientWidth, container.clientHeight);
    });
}

function createFighterMesh(data, startX, isLeft) {
    const group = new THREE.Group();

    // Body (Avatar Torso)
    const bodyGeo = new THREE.CylinderGeometry(0.5, 0.4, 1.6, 16);
    const bodyMat = new THREE.MeshStandardMaterial({ color: data.color });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.8;
    group.add(body);

    // Head with Photo Texture (FightKaro Style 3D Head)
    const headGeo = new THREE.BoxGeometry(0.9, 0.9, 0.9);
    const fallbackMat = new THREE.MeshStandardMaterial({ color: 0xfcd34d });
    const faceTex = textureLoader.load(encodeURI(data.img));
    const faceMat = new THREE.MeshBasicMaterial({ map: faceTex });
    const headMaterials = [fallbackMat, fallbackMat, fallbackMat, fallbackMat, faceMat, faceMat];
    
    const head = new THREE.Mesh(headGeo, headMaterials);
    head.position.y = 1.95;
    group.add(head);

    // Name Sprite Tag Above Head
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 64;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
    ctx.roundRect(10, 10, 236, 44, 12);
    ctx.fill();
    ctx.font = 'bold 24px Arial';
    ctx.fillStyle = '#fbbf24';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(data.name, 128, 32);

    const tex = new THREE.CanvasTexture(canvas);
    const spriteMat = new THREE.SpriteMaterial({ map: tex });
    const sprite = new THREE.Sprite(spriteMat);
    sprite.scale.set(2, 0.5, 1);
    sprite.position.y = 2.7;
    group.add(sprite);

    group.position.set(startX, 0, 0);
    scene.add(group);

    return {
        name: data.name,
        mesh: group,
        x: startX,
        y: 0,
        vy: 0,
        isLeft: isLeft,
        active: true,
        homeX: startX
    };
}

function startMatch() {
    document.getElementById('start-screen').style.display = 'none';
    document.getElementById('hud').style.display = 'flex';
    document.getElementById('controls').style.display = 'flex';
    
    scoreYou = 0; scoreAI = 0;
    updateScoreUI();

    init3D();

    yourTeam = malnadData.map((d, i) => createFighterMesh(d, -3 - i * 1.8, true));
    aiTeam = karavaliData.map((d, i) => createFighterMesh(d, 3 + i * 1.6, false));

    startTurn('YOU_RAID');
    animate();
}

function showBanner(text, duration = 1800) {
    const b = document.getElementById('banner');
    b.innerText = text;
    b.style.display = 'block';
    setTimeout(() => { b.style.display = 'none'; }, duration);
}

function startTurn(newMode) {
    mode = newMode;
    raidTimer = 30;
    baulkCrossed = false;
    touchedPlayers = [];
    tackleProgress = 0;

    let lIdx = 0;
    yourTeam.forEach(p => {
        if (p.active) { p.x = -2 - lIdx * 1.8; p.mesh.position.x = p.x; p.mesh.position.y = 0; p.vy = 0; lIdx++; }
    });
    let rIdx = 0;
    aiTeam.forEach(p => {
        if (p.active) { p.x = 2 + rIdx * 1.6; p.mesh.position.x = p.x; p.mesh.position.y = 0; p.vy = 0; rIdx++; }
    });

    const turnLabel = document.getElementById('turn-indicator');
    const actBtn = document.getElementById('btn-action');

    if (mode === 'YOU_RAID') {
        while (!yourTeam[raiderIndex % yourTeam.length].active) raiderIndex++;
        const r = yourTeam[raiderIndex % yourTeam.length];
        r.x = -1;
        turnLabel.innerText = `${r.name.toUpperCase()} RAIDING`;
        actBtn.innerText = "TOUCH";
        actBtn.style.background = "#ef4444";
        showBanner(`${r.name}'s RAID!`);
    } else {
        while (!aiTeam[aiRaiderIndex % aiTeam.length].active) aiRaiderIndex++;
        const r = aiTeam[aiRaiderIndex % aiTeam.length];
        r.x = 1;
        turnLabel.innerText = "DEFEND COURT!";
        actBtn.innerText = "TACKLE";
        actBtn.style.background = "#f59e0b";
        showBanner(`${r.name} RAIDING! DEFEND!`);
    }

    clearInterval(timerInterval);
    timerInterval = setInterval(() => {
        raidTimer--;
        document.getElementById('timer-box').innerText = raidTimer + 's';
        if (raidTimer <= 0) { clearInterval(timerInterval); endRaid(false, "TIME UP!"); }
    }, 1000);
}

function getActiveRaider() {
    if (mode === 'YOU_RAID') return yourTeam[raiderIndex % yourTeam.length];
    if (mode === 'AI_RAID') return aiTeam[aiRaiderIndex % aiTeam.length];
    return null;
}

function getControlledDefender() {
    const aiR = getActiveRaider();
    let best = null, minDist = 9999;
    yourTeam.forEach(p => {
        if (p.active) {
            const d = Math.abs(p.x - aiR.x);
            if (d < minDist) { minDist = d; best = p; }
        }
    });
    return best;
}

// Controls Input
window.addEventListener('keydown', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
    if (e.key === 'ArrowUp' || e.key === 'w') triggerJump();
    if (e.key === ' ' || e.key === 'Enter') triggerAction();
});
window.addEventListener('keyup', e => {
    if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
    if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
});

function bindTouch(id, key) {
    const el = document.getElementById(id);
    el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; });
    el.addEventListener('touchend', e => { e.preventDefault(); keys[key] = false; });
    el.addEventListener('mousedown', () => keys[key] = true);
    el.addEventListener('mouseup', () => keys[key] = false);
}
bindTouch('btn-left', 'left');
bindTouch('btn-right', 'right');
document.getElementById('btn-jump').addEventListener('touchstart', e => { e.preventDefault(); triggerJump(); });
document.getElementById('btn-jump').addEventListener('mousedown', triggerJump);
document.getElementById('btn-action').addEventListener('touchstart', e => { e.preventDefault(); triggerAction(); });
document.getElementById('btn-action').addEventListener('mousedown', triggerAction);

function triggerJump() {
    const actor = (mode === 'YOU_RAID') ? getActiveRaider() : getControlledDefender();
    if (actor && actor.y <= 0.1) actor.vy = 0.22;
}

function triggerAction() {
    if (mode === 'YOU_RAID') {
        const r = getActiveRaider();
        aiTeam.forEach(def => {
            if (def.active && !touchedPlayers.includes(def)) {
                if (Math.abs(r.x - def.x) < 2.0) {
                    touchedPlayers.push(def);
                    showBanner(`TOUCHED ${def.name.toUpperCase()}! RETURN!`);
                }
            }
        });
    } else if (mode === 'AI_RAID') {
        const def = getControlledDefender();
        const aiR = getActiveRaider();
        if (def && aiR && Math.abs(def.x - aiR.x) < 1.8) {
            tackleProgress += 50;
            showBanner("HOLDING RAIDER!");
            if (tackleProgress >= 100) endRaid(true, `SUPER TACKLE BY ${def.name.toUpperCase()}!`);
        }
    }
}

function revivePlayer(team) {
    const outP = team.find(p => !p.active);
    if (outP) outP.active = true;
}

function endRaid(defenderWon, msg) {
    clearInterval(timerInterval);
    const currentMode = mode;
    mode = 'IDLE';
    showBanner(msg, 2000);

    if (currentMode === 'YOU_RAID') {
        const r = yourTeam[raiderIndex % yourTeam.length];
        if (!defenderWon && touchedPlayers.length > 0) {
            scoreYou += touchedPlayers.length;
            touchedPlayers.forEach(d => { d.active = false; revivePlayer(yourTeam); });
        } else if (defenderWon) {
            scoreAI += 1;
            r.active = false;
            revivePlayer(aiTeam);
        }
        raiderIndex++;
        updateScoreUI();
        setTimeout(() => startTurn('AI_RAID'), 2100);
    } else if (currentMode === 'AI_RAID') {
        const aiR = aiTeam[aiRaiderIndex % aiTeam.length];
        if (defenderWon) {
            scoreYou += 1;
            aiR.active = false;
            revivePlayer(yourTeam);
        } else if (touchedPlayers.length > 0) {
            scoreAI += touchedPlayers.length;
            touchedPlayers.forEach(d => { d.active = false; revivePlayer(aiTeam); });
        }
        aiRaiderIndex++;
        updateScoreUI();
        setTimeout(() => startTurn('YOU_RAID'), 2100);
    }
}

function updateScoreUI() {
    document.getElementById('score-you').innerText = scoreYou;
    document.getElementById('score-ai').innerText = scoreAI;
}

function updateGame() {
    // Jump physics
    [...yourTeam, ...aiTeam].forEach(p => {
        if (!p.active) { p.mesh.visible = false; return; }
        p.mesh.visible = true;
        p.y += p.vy;
        if (p.y > 0) p.vy -= 0.015;
        else { p.y = 0; p.vy = 0; }
        p.mesh.position.y = p.y;
        p.mesh.position.x = p.x;
    });

    if (mode === 'YOU_RAID') {
        const r = getActiveRaider();
        const speed = 0.12;
        if (keys.left) r.x -= speed;
        if (keys.right) r.x += speed;
        r.x = Math.max(-13, Math.min(13, r.x));
        if (r.x >= 6) baulkCrossed = true;

        // AI Defenders
        aiTeam.forEach((def, idx) => {
            if (!def.active) return;
            if (r.x > 0) {
                const targetX = r.x + (idx - 2) * 1.2;
                def.x += Math.sign(targetX - def.x) * 0.04;
                if (Math.abs(def.x - r.x) < 1.1 && r.y < 0.2 && Math.random() < 0.03) {
                    endRaid(true, `TACKLED BY ${def.name.toUpperCase()}!`);
                }
            } else {
                def.x += (def.homeX - def.x) * 0.05;
            }
        });

        if (r.x < -0.5 && (baulkCrossed || touchedPlayers.length > 0)) {
            endRaid(false, touchedPlayers.length > 0 ? `SAFE! +${touchedPlayers.length} PTS!` : "EMPTY RAID");
        }
    } else if (mode === 'AI_RAID') {
        const aiR = getActiveRaider();
        const myDef = getControlledDefender();

        if (myDef) {
            const defSpeed = 0.12;
            if (keys.left) myDef.x -= defSpeed;
            if (keys.right) myDef.x += defSpeed;
            myDef.x = Math.max(-13, Math.min(-0.5, myDef.x));
        }

        if (touchedPlayers.length === 0 && raidTimer > 5) {
            aiR.x -= 0.09;
            if (aiR.x <= -6) baulkCrossed = true;
            yourTeam.forEach(def => {
                if (def.active && Math.abs(aiR.x - def.x) < 1.3 && Math.random() < 0.02) {
                    touchedPlayers.push(def);
                    showBanner(`${aiR.name} TOUCHED ${def.name}!`);
                }
            });
        } else {
            aiR.x += 0.1;
            if (aiR.x > 0.5) {
                endRaid(false, touchedPlayers.length > 0 ? `AI SCORED +${touchedPlayers.length} PTS!` : "AI EMPTY RAID");
            }
        }
        if (tackleProgress > 0) tackleProgress -= 0.5;
    }
}

function animate() {
    requestAnimationFrame(animate);
    updateGame();
    renderer.render(scene, camera);
}
</script>
</body>
</html>

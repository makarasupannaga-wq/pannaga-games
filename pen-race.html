<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pen Race Track - Notebook Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #1e293b;
      color: #0f172a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }

    /* Setup & Win Overlays */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.88);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 20;
      padding: 16px;
    }

    .hidden {
      display: none !important;
    }

    .card {
      background: #fffdf7;
      border-radius: 16px;
      padding: 22px;
      width: 100%;
      max-width: 390px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.45);
      border: 2px solid #cbd5e1;
      text-align: center;
    }

    .card h1 {
      font-size: 1.5rem;
      color: #1e3a8a;
      margin-bottom: 4px;
    }

    .card p.subtitle {
      font-size: 0.85rem;
      color: #64748b;
      margin-bottom: 16px;
    }

    .section-label {
      display: block;
      text-align: left;
      font-size: 0.82rem;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
      margin-top: 12px;
    }

    .btn-group {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
    }

    .track-group {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .opt-btn {
      padding: 10px 8px;
      border: 2px solid #cbd5e1;
      background: #f8fafc;
      border-radius: 10px;
      font-weight: 600;
      font-size: 0.82rem;
      color: #334155;
      cursor: pointer;
      transition: all 0.15s;
    }

    .opt-btn.active {
      border-color: #2563eb;
      background: #dbeafe;
      color: #1d4ed8;
    }

    .primary-btn {
      margin-top: 18px;
      width: 100%;
      padding: 13px;
      background: #16a34a;
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(22, 163, 74, 0.35);
    }

    .primary-btn:active {
      transform: scale(0.98);
    }

    /* Game Container */
    #gameWrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 430px;
      height: 100vh;
      max-height: 820px;
      padding: 8px;
    }

    /* Top HUD */
    #hud {
      width: 100%;
      background: #fffdf7;
      border-radius: 12px;
      padding: 8px 12px;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      border-bottom: 3px solid #94a3b8;
    }

    .turn-info {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .pen-badge {
      width: 16px;
      height: 16px;
      border-radius: 50%;
      border: 2px solid #0f172a;
    }

    #turnText {
      font-weight: 800;
      font-size: 0.95rem;
    }

    #statusHint {
      font-size: 0.74rem;
      color: #475569;
      display: block;
    }

    .hud-actions {
      display: flex;
      gap: 6px;
    }

    .small-btn {
      padding: 6px 10px;
      font-size: 0.75rem;
      font-weight: 700;
      border-radius: 8px;
      border: 1px solid #cbd5e1;
      background: #f1f5f9;
      color: #1e293b;
      cursor: pointer;
    }

    .small-btn.green {
      background: #16a34a;
      color: #fff;
      border-color: #15803d;
    }

    /* Notebook Canvas */
    #canvasBox {
      position: relative;
      flex: 1;
      width: 100%;
      background: #fffef9;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      border: 2px solid #cbd5e1;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }

    #customDrawBar {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      padding: 10px 12px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.8rem;
      z-index: 10;
    }
  </style>
</head>
<body>

  <!-- Setup Modal -->
  <div id="setupModal" class="overlay">
    <div class="card">
      <h1>🖊️ Pen Race Track</h1>
      <p class="subtitle">Classic Notebook Pen Flicking Game</p>

      <span class="section-label">1. Select Game Mode</span>
      <div class="btn-group" id="playerBtns">
        <button class="opt-btn active" data-val="1">🤖 1P vs AI</button>
        <button class="opt-btn" data-val="2">👥 2 Players</button>
        <button class="opt-btn" data-val="3">👥 3 Players</button>
        <button class="opt-btn" data-val="4">👥 4 Players</button>
      </div>

      <span class="section-label">2. Choose Race Track</span>
      <div class="track-group" id="trackBtns">
        <button class="opt-btn active" data-val="classic">📓 Classic S-Curve</button>
        <button class="opt-btn" data-val="zigzag">⚡ Zig-Zag Bend</button>
        <button class="opt-btn" data-val="tunnel">🎯 Narrow Tunnel</button>
        <button class="opt-btn" data-val="custom">✏️ Draw Your Own</button>
      </div>

      <button id="startBtn" class="primary-btn">Start Race</button>
    </div>
  </div>

  <!-- Winner Modal -->
  <div id="winModal" class="overlay hidden">
    <div class="card">
      <h1 id="winnerTitle">🏆 Player 1 Wins!</h1>
      <p class="subtitle" id="winnerSub">Reached the END line first!</p>
      <button id="playAgainBtn" class="primary-btn">Play Again / New Track</button>
    </div>
  </div>

  <!-- Main Game UI -->
  <div id="gameWrapper">
    <div id="hud">
      <div class="turn-info">
        <div id="penBadge" class="pen-badge" style="background:#1d4ed8;"></div>
        <div>
          <span id="turnText">Player 1's Turn</span>
          <span id="statusHint">Drag back from your dot & release to slide pen!</span>
        </div>
      </div>
      <div class="hud-actions">
        <button id="menuBtn" class="small-btn">Menu</button>
      </div>
    </div>

    <div id="canvasBox">
      <canvas id="gameCanvas"></canvas>
      <div id="customDrawBar" class="hidden">
        <span>Draw road path from bottom to top!</span>
        <div style="display:flex; gap:6px;">
          <button id="clearCustomBtn" class="small-btn">Clear</button>
          <button id="doneCustomBtn" class="small-btn green">Done</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const canvasBox = document.getElementById('canvasBox');

    // UI Elements
    const setupModal = document.getElementById('setupModal');
    const winModal = document.getElementById('winModal');
    const customDrawBar = document.getElementById('customDrawBar');
    const turnText = document.getElementById('turnText');
    const statusHint = document.getElementById('statusHint');
    const penBadge = document.getElementById('penBadge');

    // Game Config
    let modePlayers = 1; // 1 means 1P vs AI, 2/3/4 means Pass & Play
    let selectedTrack = 'classic';
    const PLAYER_COLORS = [
      { name: 'Player 1 (Blue)', hex: '#1d4ed8' },
      { name: 'Player 2 (Red)', hex: '#dc2626' },
      { name: 'Player 3 (Green)', hex: '#15803d' },
      { name: 'Player 4 (Purple)', hex: '#7e22ce' }
    ];

    // Game State
    let W = 380, H = 680;
    let leftWall = [];
    let rightWall = [];
    let centerLine = []; // Used by AI for navigation
    let startLine = null;
    let endLine = null;

    let players = [];
    let currentPlayerIdx = 0;
    let gamePhase = 'SETUP'; // SETUP, DRAW_TRACK, AIM, AI_THINKING, SLIDING, GAMEOVER

    // Custom track drawing state
    let customCenterPoints = [];
    let isDrawingTrack = false;

    // Flick / Aiming state
    let isAiming = false;
    let aimCurrent = null;

    // Sliding animation state
    let slideAnim = null;

    // Setup Option Buttons
    document.querySelectorAll('#playerBtns .opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#playerBtns .opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        modePlayers = parseInt(btn.dataset.val);
      });
    });

    document.querySelectorAll('#trackBtns .opt-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('#trackBtns .opt-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        selectedTrack = btn.dataset.val;
      });
    });

    document.getElementById('startBtn').addEventListener('click', () => {
      setupModal.classList.add('hidden');
      resizeCanvas();
      if (selectedTrack === 'custom') {
        startCustomTrackMode();
      } else {
        buildPresetTrack(selectedTrack);
        initPlayers();
      }
    });

    document.getElementById('menuBtn').addEventListener('click', () => {
      gamePhase = 'SETUP';
      customDrawBar.classList.add('hidden');
      winModal.classList.add('hidden');
      setupModal.classList.remove('hidden');
    });

    document.getElementById('playAgainBtn').addEventListener('click', () => {
      winModal.classList.add('hidden');
      setupModal.classList.remove('hidden');
    });

    // Resize Canvas properly
    function resizeCanvas() {
      const rect = canvasBox.getBoundingClientRect();
      W = rect.width;
      H = rect.height;
      canvas.width = W;
      canvas.height = H;
    }

    // Build Preset Tracks using normalized coordinates (0..1)
    function buildPresetTrack(type) {
      let leftNorm = [], rightNorm = [];

      if (type === 'classic') {
        leftNorm = [
          [0.14, 0.94], [0.18, 0.84], [0.22, 0.72], [0.16, 0.58],
          [0.08, 0.44], [0.12, 0.28], [0.28, 0.14], [0.55, 0.08],
          [0.82, 0.09], [0.92, 0.11]
        ];
        rightNorm = [
          [0.58, 0.94], [0.54, 0.80], [0.46, 0.65], [0.36, 0.50],
          [0.34, 0.37], [0.45, 0.28], [0.68, 0.25], [0.92, 0.25]
        ];
      } else if (type === 'zigzag') {
        leftNorm = [
          [0.12, 0.94], [0.12, 0.76], [0.48, 0.56], [0.12, 0.36],
          [0.12, 0.14], [0.45, 0.08], [0.88, 0.08]
        ];
        rightNorm = [
          [0.52, 0.94], [0.52, 0.80], [0.88, 0.56], [0.52, 0.36],
          [0.52, 0.24], [0.88, 0.24]
        ];
      } else if (type === 'tunnel') {
        leftNorm = [
          [0.26, 0.94], [0.22, 0.75], [0.32, 0.55], [0.20, 0.35],
          [0.30, 0.16], [0.55, 0.08], [0.88, 0.08]
        ];
        rightNorm = [
          [0.56, 0.94], [0.52, 0.75], [0.62, 0.55], [0.50, 0.35],
          [0.60, 0.22], [0.88, 0.22]
        ];
      }

      leftWall = leftNorm.map(p => ({ x: p[0] * W, y: p[1] * H }));
      rightWall = rightNorm.map(p => ({ x: p[0] * W, y: p[1] * H }));

      // Start Line near bottom
      startLine = {
        a: { x: leftWall[0].x + (leftWall[1].x - leftWall[0].x) * 0.4, y: H * 0.88 },
        b: { x: rightWall[0].x + (rightWall[1].x - rightWall[0].x) * 0.4, y: H * 0.88 }
      };

      // End Line near top-right
      const lLast = leftWall[leftWall.length - 1];
      const lPrev = leftWall[leftWall.length - 2];
      const rLast = rightWall[rightWall.length - 1];
      const rPrev = rightWall[rightWall.length - 2];
      endLine = {
        a: { x: (lLast.x + lPrev.x) * 0.5, y: (lLast.y + lPrev.y) * 0.5 },
        b: { x: (rLast.x + rPrev.x) * 0.5, y: (rLast.y + rPrev.y) * 0.5 }
      };

      computeCenterWaypoints();
    }

    // Generate waypoints along the track center for AI navigation
    function computeCenterWaypoints() {
      centerLine = [];
      const steps = 14;
      for (let s = 0; s <= steps; s++) {
        const t = s / steps;
        const lPt = samplePolyline(leftWall, t);
        const rPt = samplePolyline(rightWall, t);
        centerLine.push({
          x: (lPt.x + rPt.x) * 0.5,
          y: (lPt.y + rPt.y) * 0.5
        });
      }
    }

    function samplePolyline(pts, t) {
      if (pts.length === 0) return { x: 0, y: 0 };
      if (t <= 0) return pts[0];
      if (t >= 1) return pts[pts.length - 1];
      const idxFloat = t * (pts.length - 1);
      const idx = Math.floor(idxFloat);
      const frac = idxFloat - idx;
      const p1 = pts[idx];
      const p2 = pts[idx + 1];
      return {
        x: p1.x + (p2.x - p1.x) * frac,
        y: p1.y + (p2.y - p1.y) * frac
      };
    }

    // Custom Track Drawing Mode
    function startCustomTrackMode() {
      gamePhase = 'DRAW_TRACK';
      customCenterPoints = [];
      leftWall = [];
      rightWall = [];
      centerLine = [];
      startLine = null;
      endLine = null;
      customDrawBar.classList.remove('hidden');
      turnText.textContent = 'Draw Your Race Track';
      statusHint.textContent = 'Drag finger on paper to create road';
      drawScene();
    }

    document.getElementById('clearCustomBtn').addEventListener('click', () => {
      customCenterPoints = [];
      drawScene();
    });

    document.getElementById('doneCustomBtn').addEventListener('click', () => {
      if (customCenterPoints.length < 5) {
        alert('Please draw a slightly longer road path first!');
        return;
      }
      generateWallsFromCenterline(customCenterPoints, Math.min(W * 0.16, 62));
      customDrawBar.classList.add('hidden');
      initPlayers();
    });

    function generateWallsFromCenterline(pts, halfWidth) {
      const clean = [pts[0]];
      for (let i = 1; i < pts.length; i++) {
        const d = Math.hypot(pts[i].x - clean[clean.length - 1].x, pts[i].y - clean[clean.length - 1].y);
        if (d > 18) clean.push(pts[i]);
      }
      if (clean.length < 3) return;

      leftWall = [];
      rightWall = [];
      centerLine = clean;

      for (let i = 0; i < clean.length; i++) {
        const prev = clean[Math.max(0, i - 1)];
        const next = clean[Math.min(clean.length - 1, i + 1)];
        const dx = next.x - prev.x;
        const dy = next.y - prev.y;
        const len = Math.hypot(dx, dy) || 1;
        const nx = -dy / len;
        const ny = dx / len;

        leftWall.push({ x: clean[i].x + nx * halfWidth, y: clean[i].y + ny * halfWidth });
        rightWall.push({ x: clean[i].x - nx * halfWidth, y: clean[i].y - ny * halfWidth });
      }

      startLine = {
        a: { x: leftWall[0].x, y: leftWall[0].y },
        b: { x: rightWall[0].x, y: rightWall[0].y }
      };

      const endIdx = leftWall.length - 1;
      endLine = {
        a: { x: leftWall
